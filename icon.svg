<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DeepSeek whale in an open shipping box">
  <title>dsh-export-viewer - DeepSeek whale in an open box</title>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfdfb"/>
      <stop offset="1" stop-color="#eef1f5"/>
    </linearGradient>
    <radialGradient id="paperGlow" cx="0.3" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="faceLeft" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#e6a95f"/>
      <stop offset="1" stop-color="#cd8436"/>
    </linearGradient>
    <linearGradient id="faceRight" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#d28e42"/>
      <stop offset="1" stop-color="#b26822"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdda9"/>
      <stop offset="1" stop-color="#eab571"/>
    </linearGradient>
    <linearGradient id="liner" x1="0" y1="0" x2="0.1" y2="1">
      <stop offset="0" stop-color="#fbf2e1"/>
      <stop offset="0.55" stop-color="#f0ddbd"/>
      <stop offset="1" stop-color="#d9bd92"/>
    </linearGradient>
    <linearGradient id="linerShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b431f" stop-opacity="0.42"/>
      <stop offset="0.22" stop-color="#6b431f" stop-opacity="0"/>
      <stop offset="0.7" stop-color="#6b431f" stop-opacity="0"/>
      <stop offset="1" stop-color="#6b431f" stop-opacity="0.32"/>
    </linearGradient>
    <linearGradient id="flapBack" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#f2c88c"/>
      <stop offset="1" stop-color="#d89a50"/>
    </linearGradient>
    <linearGradient id="flapFront" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffdda9"/>
      <stop offset="1" stop-color="#e6ac61"/>
    </linearGradient>
    <clipPath id="opening">
      <path d="M32 23.2 L53.9 34.8 L32 46.4 L10.1 34.8 Z"/>
    </clipPath>
    <filter id="boxShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.9"/>
    </filter>
    <filter id="flapShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#paper)"/>
  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#paperGlow)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13.75" fill="none" stroke="#dfe3e9" stroke-width="0.5"/>

  <g transform="translate(0 -3.5)">

  <ellipse cx="32" cy="59.8" rx="21" ry="2.9" fill="#1d2430" opacity="0.16" filter="url(#boxShadow)"/>

  <!-- Four top flaps. Each is half the lid deep, so either opposite pair meets at the centerline when closed. -->

  <!-- back flaps, hinged on the two far top edges -->
  <path d="M8 34.5 L32 22 L26.88 12.17 L2.88 24.67 Z" fill="url(#flapBack)" stroke="#87501f" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M32 22 L56 34.5 L61.12 24.67 L37.12 12.17 Z" fill="url(#flapBack)" stroke="#87501f" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M8 34.5 L32 22 L31 23.1 L8.3 35" fill="none" stroke="#ffdfae" stroke-width="0.7" opacity="0.5"/>
  <path d="M32 22 L56 34.5 L55.7 35.6 L33 23.1" fill="none" stroke="#8a4c13" stroke-width="0.7" opacity="0.3"/>
  <path d="M2.88 24.67 L8.3 35" fill="none" stroke="#6f3c11" stroke-width="0.7" opacity="0.35"/>
  <path d="M61.12 24.67 L55.7 35" fill="none" stroke="#6f3c11" stroke-width="0.7" opacity="0.35"/>

  <!-- box opening, lined with pale packing paper (background only) -->
  <path d="M8 34.5 L32 22 L56 34.5 L32 47 Z" fill="#7c4c22" stroke="#6d3f17" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M10.1 34.8 L32 23.2 L53.9 34.8 L32 46.4 Z" fill="url(#liner)"/>

  <g clip-path="url(#opening)">
    <rect x="8" y="22" width="48" height="26" fill="url(#linerShade)"/>
    <path d="M11 31.4 C18 29.6 25 30.8 31.8 33.4 C39.8 36.4 46 36.8 53 32.7" fill="none" stroke="#c8a878" stroke-width="1.1" opacity="0.45"/>
    <path d="M14 27.8 C21 26.4 26 28.4 31 30.4" fill="none" stroke="#fffaf0" stroke-width="0.9" opacity="0.55"/>
    <ellipse cx="32" cy="45.2" rx="13.5" ry="2.1" fill="#6f451d" opacity="0.3" filter="url(#soft)"/>
  </g>

  <!-- the DeepSeek whale, seated in the box -->
  <g transform="translate(15 22) scale(1.468)">
    <path d="M22.9168 1.43018C22.6713 1.31018 22.5658 1.53918 22.4223 1.65519C22.3733 1.69269 22.3318 1.74169 22.2903 1.78669C21.9317 2.1697 21.5127 2.42121 20.9657 2.39121C20.1657 2.34621 19.4827 2.59771 18.8787 3.20973C18.7502 2.45521 18.3236 2.0047 17.6746 1.71569C17.3351 1.56568 16.9916 1.41518 16.7536 1.08867C16.5876 0.856163 16.5421 0.597155 16.4591 0.341647C16.4061 0.187643 16.3536 0.0301382 16.1761 0.00363739C15.9836 -0.0263635 15.9081 0.135141 15.8326 0.270145C15.5306 0.822162 15.4136 1.43018 15.4251 2.0462C15.4516 3.43174 16.0366 4.53527 17.1991 5.3203C17.3311 5.4103 17.3651 5.5003 17.3236 5.63181C17.2441 5.90231 17.1501 6.16482 17.0671 6.43533C17.0141 6.60784 16.9351 6.64584 16.7501 6.57033C16.1121 6.30383 15.5611 5.90931 15.074 5.4328C14.2475 4.63328 13.5 3.75075 12.568 3.05973C12.349 2.89822 12.13 2.74822 11.9034 2.60522C10.9524 1.68169 12.028 0.923165 12.277 0.833162C12.5375 0.739159 12.3675 0.41615 11.5259 0.42015C10.6844 0.42365 9.91439 0.705658 8.93286 1.08117C8.78935 1.13767 8.63835 1.17867 8.48384 1.21267C7.59332 1.04367 6.66829 1.00617 5.70226 1.11517C3.88321 1.31768 2.43016 2.1777 1.36213 3.64575C0.0790928 5.4103 -0.222916 7.41536 0.146595 9.50642C0.535106 11.7105 1.66014 13.535 3.38869 14.9616C5.18125 16.4406 7.24581 17.1657 9.60138 17.0266C11.0319 16.9441 12.6245 16.7526 14.421 15.2321C14.874 15.4576 15.3496 15.5476 16.1381 15.6151C16.7456 15.6716 17.3306 15.5851 17.7836 15.4911C18.4931 15.3411 18.4441 14.6841 18.1876 14.5636C16.1081 13.595 16.5646 13.9891 16.1496 13.67C17.2061 12.42 18.8202 10.1979 19.3182 7.17235C19.3672 6.83834 19.4297 6.36783 19.4222 6.09732C19.4182 5.93231 19.4562 5.86831 19.6447 5.84931C20.1657 5.78931 20.6712 5.64681 21.1357 5.3913C22.4833 4.65528 23.0268 3.44624 23.1548 1.9972C23.1738 1.77569 23.1508 1.54668 22.9168 1.43018ZM11.1749 14.4736C9.15936 12.889 8.18184 12.3675 7.77832 12.39C7.40081 12.4125 7.46881 12.8445 7.55182 13.126C7.63882 13.404 7.75182 13.5955 7.91033 13.8396C8.01983 14.0011 8.09533 14.2411 7.80083 14.4216C7.15181 14.8231 6.02327 14.2866 5.97027 14.2601C4.65673 13.4865 3.5587 12.4655 2.78467 11.069C2.03715 9.72493 1.60314 8.28289 1.53164 6.74384C1.51264 6.37233 1.62214 6.24082 1.99215 6.17332C2.47916 6.08332 2.98118 6.06432 3.46769 6.13582C5.52476 6.43633 7.27581 7.35586 8.74385 8.8129C9.58188 9.64243 10.2159 10.634 10.8689 11.6025C11.5634 12.631 12.3105 13.611 13.262 14.4146C13.598 14.6961 13.866 14.9101 14.1225 15.0681C13.349 15.1546 12.058 15.1731 11.1749 14.4746L11.1749 14.4736ZM12.141 8.25988C12.141 8.09488 12.273 7.96338 12.439 7.96338C12.4765 7.96338 12.5105 7.97088 12.541 7.98188C12.5825 7.99688 12.6205 8.01938 12.6505 8.05338C12.7035 8.10588 12.7335 8.18088 12.7335 8.25988C12.7335 8.42489 12.6015 8.55639 12.4355 8.55639C12.2695 8.55639 12.141 8.42489 12.141 8.25988ZM15.1415 9.79893C14.949 9.87793 14.7565 9.94544 14.5715 9.95294C14.2845 9.96794 13.9715 9.85143 13.8015 9.70893C13.5375 9.48742 13.3485 9.36342 13.2695 8.97691C13.2355 8.8119 13.2545 8.55639 13.2845 8.40989C13.3525 8.09438 13.277 7.89187 13.0545 7.70787C12.8735 7.55786 12.643 7.51636 12.39 7.51636C12.2955 7.51636 12.209 7.47486 12.1445 7.44136C12.039 7.38886 11.9519 7.25735 12.035 7.09585C12.0615 7.04335 12.19 6.91584 12.22 6.89334C12.5635 6.69784 12.9595 6.76184 13.326 6.90834C13.6655 7.04735 13.9225 7.30236 14.292 7.66287C14.6695 8.09838 14.7375 8.21838 14.9525 8.54539C15.1225 8.8009 15.277 9.06341 15.3831 9.36392C15.4471 9.55142 15.3641 9.70493 15.1415 9.79893Z" fill="#111319"/>
  </g>

  <!-- front faces -->
  <path d="M8 34.5 L32 47 L32 60.2 L8 47.7 Z" fill="url(#faceLeft)" stroke="#7c471b" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M56 34.5 L32 47 L32 60.2 L56 47.7 Z" fill="url(#faceRight)" stroke="#7c471b" stroke-width="1.15" stroke-linejoin="round"/>
  <path d="M32 47 V60.2" stroke="#a56528" stroke-width="0.9" opacity="0.45"/>
  <path d="M32 48.1 V60.2" stroke="#ffe1b1" stroke-width="2.2" opacity="0.3"/>

  <!-- shadows from the front flaps onto the face -->
  <path d="M8 34.5 L32 47 L26.88 56.83 L2.88 44.33 Z" fill="#4b260b" opacity="0.22" filter="url(#flapShadow)" transform="translate(0 0.9)"/>
  <path d="M32 47 L56 34.5 L61.12 44.33 L37.12 56.83 Z" fill="#4b260b" opacity="0.22" filter="url(#flapShadow)" transform="translate(0 0.9)"/>

  <!-- front flaps, folded out toward the viewer -->
  <path d="M8 34.5 L32 47 L26.88 56.83 L2.88 44.33 Z" fill="url(#flapFront)" stroke="#7c471b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M32 47 L56 34.5 L61.12 44.33 L37.12 56.83 Z" fill="url(#flapFront)" stroke="#7c471b" stroke-width="1.1" stroke-linejoin="round"/>
  <path d="M2.88 44.33 L8.3 35" fill="none" stroke="#6f3c11" stroke-width="0.7" opacity="0.4"/>
  <path d="M61.12 44.33 L55.7 35" fill="none" stroke="#6f3c11" stroke-width="0.7" opacity="0.4"/>
  <path d="M9.6 38.2 L28.2 47.6" stroke="#fff0d4" stroke-width="0.65" opacity="0.5"/>
  <path d="M54.4 38.2 L35.8 47.6" stroke="#fff0d4" stroke-width="0.65" opacity="0.45"/>

  <!-- near rim, capping the front hinges -->
  <path d="M8 34.5 L32 47 L56 34.5 L53.9 34.8 L32 45.6 L10.1 34.8 Z" fill="url(#rim)" stroke="#7c471b" stroke-width="0.9" stroke-linejoin="round"/>
  <path d="M11.6 35.9 L32 45.9 L52.4 35.9" fill="none" stroke="#fff0d4" stroke-width="0.7" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>


